{# One primary action per email. Usage: {% include "emails/_button.html" with url=... label="..." %} #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" class="ax-btn-table" style="margin:8px 0 4px 0;">
  <tr>
    <td class="ax-btn-cell" align="center" bgcolor="#d82121" style="background-color:#d82121;border-radius:8px;mso-padding-alt:12px 24px;">
      <a href="{{ url }}" class="ax-btn-link" style="display:inline-block;padding:12px 24px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;mso-padding-alt:0;">{{ label }}</a>
    </td>
  </tr>
</table>

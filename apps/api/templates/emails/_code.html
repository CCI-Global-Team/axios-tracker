{# A one-time code, big enough to read across a room and selectable as one word. #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 20px 0;">
  <tr>
    <td align="center" class="ax-panel" style="background-color:#f4f6f9;border:1px solid #e3e7ed;border-radius:10px;padding:20px 12px;">
      <span class="ax-code ax-strong" style="font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:34px;line-height:40px;font-weight:600;letter-spacing:8px;color:#151f32;">{{ code }}</span>
    </td>
  </tr>
</table>

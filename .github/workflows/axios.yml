# Moves the Axios work item named in a branch or PR.
#
#   branch created with a key in its name, or PR opened  ->  In Progress
#   PR merged into the default branch                    ->  Ready for Test
#
# All the logic lives in the reusable workflow so the six repos share one implementation.
# Requires one repository secret: AXIOS_BOT_TOKEN.
name: Axios

on:
  push:
  pull_request:
    # `edited` matters: the title takes precedence over the branch name when looking for a ticket
    # key, and people routinely add the key by renaming a PR they have already opened. Without it
    # that rename fires nothing, and the work item sits in Todo until the PR merges - skipping In
    # Progress entirely. Edits that leave the title alone are refused by the reusable workflow's
    # job-level if:, which is the only place a run can be stopped before it costs a minute.
    #
    # ready_for_review / converted_to_draft / review_requested and the review verdicts drive
    # In Progress <-> Ready for Review. The reusable workflow refuses the ones that cannot move
    # anything before a runner starts.
    types: [opened, reopened, edited, closed, ready_for_review, converted_to_draft, review_requested]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  transition:
    uses: ./.github/workflows/axios-transition.yml
    secrets:
      axios_bot_token: ${{ secrets.AXIOS_BOT_TOKEN }}

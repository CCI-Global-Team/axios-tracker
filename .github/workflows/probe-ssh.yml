# TEMPORARY probe: can a GitHub-hosted runner reach the box's SSH port at all?
#
# The answer decides how deployment connects. If port 22 is already open to the internet then
# CI can deploy today with nothing but a key, and no exposure is being added. If it is closed,
# something has to change, and it is better to know which before proposing it.
#
# Deliberately connects and nothing more — no key, no auth attempt.
# Delete this workflow once the question is answered.
name: Probe SSH reachability

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can we open a TCP connection to 13.49.176.148:22?
        run: |
          echo "runner egress IP: $(curl -s https://api.ipify.org || echo unknown)"
          if timeout 10 bash -c 'cat < /dev/null > /dev/tcp/13.49.176.148/22' 2>/dev/null; then
            echo "RESULT: OPEN — the Lightsail firewall already allows SSH from GitHub runners"
          else
            echo "RESULT: CLOSED or filtered — no route in from a hosted runner"
          fi
          echo "--- banner, if any (proves it is really sshd) ---"
          timeout 10 bash -c 'exec 3<>/dev/tcp/13.49.176.148/22; head -c 60 <&3' 2>/dev/null || echo "(no banner)"

# Reusable: move an Axios work item when a branch or pull request says so.
#
# Called by each product repo with a ten-line caller, so the logic lives in ONE place. Six copies
# would drift, and the copy that drifts is the one nobody notices has stopped working.
#
# In the calling repo, .github/workflows/axios.yml:
#
#   name: Axios
#   on:
#     push:
#     pull_request:
#       types: [opened, reopened, edited, closed]
#   jobs:
#     transition:
#       uses: CCI-Global-Team/axios-tracker/.github/workflows/axios-transition.yml@cci/patches
#       secrets:
#         axios_bot_token: ${{ secrets.AXIOS_BOT_TOKEN }}
#
# The caller needs one secret: AXIOS_BOT_TOKEN, the Axios Bot's API token. Org-level secrets are
# not available for private repos on a Free plan, so each repo carries its own copy.
name: Axios work item transition

on:
  workflow_call:
    secrets:
      axios_bot_token:
        required: true

jobs:
  transition:
    runs-on: ubuntu-latest
    # Billing starts when a job reaches a runner, not when a step runs, and every job is rounded
    # up to a whole minute. So the two cases the script exits on immediately - a push to a branch
    # that already exists, and a PR edit that left the title alone - have to be refused here or
    # they are paid for in full. They were about two thirds of this workflow's minutes, against a
    # 2,000-minute monthly allowance the org has already exhausted once.
    # github here is the CALLER's context, so this reads the product repo's own event.
    if: >-
      (github.event_name == 'push' && github.event.created) ||
      (github.event_name == 'pull_request' &&
      (github.event.action != 'edited' || github.event.changes.title != null))
    # Never block a merge or a push. A PR with no ticket key is normal, and a red X on those
    # would teach people to ignore this check entirely.
    continue-on-error: true
    permissions:
      contents: read
      # write, not read: the bot comments the Axios work item onto the PR so the link goes
      # both ways. Still read-only for finding sibling PRs before advancing to Ready for Test.
      pull-requests: write
    steps:
      - name: Fetch the transition script
        # From THIS repo, not the caller's, so product repos carry no Axios logic.
        uses: actions/checkout@v4
        with:
          repository: CCI-Global-Team/axios-tracker
          ref: cci/patches
          fetch-depth: 1

      - name: Verify the script is present
        # A checkout can succeed while omitting the one file it exists to fetch — Plane's
        # .gitignore has a bare `scripts/` that matches .github/scripts at any depth, so the
        # script was untracked and every checkout came back without it. Two rounds went into
        # blaming the checkout because node reported it a step later as "Cannot find module".
        # Fail here instead, naming the cause.
        run: test -f .github/scripts/axios-transition.mjs || {
          echo "::error::transition script missing from the checkout"; exit 1; }

      - name: Transition
        env:
          AXIOS_BOT_TOKEN: ${{ secrets.axios_bot_token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/axios-transition.mjs
